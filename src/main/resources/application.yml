spring:
  application:
    name: slack-lab
  main:
    banner-mode: off
  # Postgres는 어댑터가 DataSource를 직접 만든다(M20~M22). 자동 구성이 켜지면 접속 정보가 없는 역할(수신·복구)도
  # DataSource 생성에 실패한다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

# 역할: receiver | worker | reactor | recovery | all(개발 기본값). 컨테이너는 APP_ROLE로 지정한다.
app:
  role: ${APP_ROLE:all}

# 필수 값(slack.signing-secret, slack.bot-token, llm.model)은 기본값을 두지 않는다.
# 비어 있으면 기동이 실패해야 한다(A3). 값은 환경변수로 주입한다(.env.example 참조).
slack:
  signing-secret: ${SLACK_SIGNING_SECRET:}
  bot-token: ${SLACK_BOT_TOKEN:}

# 3단계 RAG(기본 꺼짐 — 꺼도 기존 흐름 그대로). 켜려면 모델 ID·차원이 필요하다(기본값 없음). 외부 호스트는 허용 플래그가 있어야 한다.
rag:
  enabled: ${RAG_ENABLED:false}
  embedding-base-url: ${RAG_EMBEDDING_BASE_URL:http://localhost:11434/v1}
  embedding-model: ${RAG_EMBEDDING_MODEL:}
  embedding-dimension: ${RAG_EMBEDDING_DIMENSION:0}
  allow-external-llm: ${RAG_ALLOW_EXTERNAL_LLM:false}
  allow-external-embedding: ${RAG_ALLOW_EXTERNAL_EMBEDDING:false}
  index:
    docs-dir: ${RAG_DOCS_DIR:}
  retrieval:
    # 기본값은 코드(RagRetrievalProperties)가 정한다 — M30 실측값. 환경변수로 덮어쓸 때만 쓴다.
    top-k: ${RAG_RETRIEVAL_TOP_K:3}
    min-score: ${RAG_RETRIEVAL_MIN_SCORE:0.54}
    max-context-chars: ${RAG_RETRIEVAL_MAX_CONTEXT_CHARS:1500}

# 4단계 요청 분류(기본 꺼짐 — 꺼도 3단계 흐름 그대로). 켜려면 모델 ID가 필요하다(기본값 없음, `ollama list`). llm.base-url을 공유하므로
# 로컬 Ollama 안의 다중 모델까지만 가능하다. 16GB 노트북에서는 답변 모델과 같은 모델을 쓴다(EXPERIMENT-LOG §39).
classification:
  enabled: ${CLASSIFICATION_ENABLED:false}
  model: ${CLASSIFICATION_MODEL:}
  timeout-ms: ${CLASSIFICATION_TIMEOUT_MS:5000}
  keep-alive: ${CLASSIFICATION_KEEP_ALIVE:30m}

llm:
  client: ${LLM_CLIENT:ollama}
  base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
  model: ${LLM_MODEL:}

# 6단계 M44: 한 줄 JSON 로그. 콘솔과 회전 파일이 같은 포매터라 내용이 같다(로그 저장소는 파일을 읽는다).
# 파일 위치는 역할별로 갈라 컨테이너/호스트 어느 쪽에서든 수집기가 경로 4개를 명시해 읽는다. 회전은 3일·200MB.
logging:
  structured:
    format:
      console: com.slack.lab.adapter.logging.SlackLabJsonFormatter
      file: com.slack.lab.adapter.logging.SlackLabJsonFormatter
  file:
    name: ${SLACK_LAB_LOG_DIR:.runtime/logs}/${app.role}/slack-lab.log
  logback:
    rollingpolicy:
      max-history: 3
      total-size-cap: 200MB
      max-file-size: 50MB
