# 2단계 후속 실행 환경 (ADR-9): RabbitMQ(큐) + Postgres(작업 상태). Redis는 쓰지 않는다.
# - 개발: docker compose up -d rabbitmq postgres 후 호스트에서 bootRun (POSTGRES_PASSWORD는 .env에서 읽는다)
# - 통합 검증·실험: docker compose --profile app up --build
# Ollama는 컨테이너로 띄우지 않는다. 호스트의 ollama serve를 host.docker.internal로 호출한다.
# 주의: POSTGRES_PASSWORD가 .env에 없으면 어떤 compose 명령도 실패한다(파일 전체를 보간한다).
# 메모리 상한은 노트북 한 대에서 LLM과 함께 돌릴 때를 가정한 값이다(laptop 부하 정책).

x-app: &app
  # 세 역할이 같은 이미지를 쓴다 — 한 번만 빌드된다.
  image: slack-lab-app
  build: .
  profiles: ["app"]
  env_file: .env
  depends_on:
    rabbitmq:
      condition: service_healthy
    postgres:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"
  mem_limit: 512m

x-app-env: &app-env
  RABBITMQ_HOST: rabbitmq
  POSTGRES_URL: jdbc:postgresql://postgres:5432/slacklab
  LLM_BASE_URL: http://host.docker.internal:11434/v1
  # 3단계 RAG(기본 꺼짐). 컨테이너의 localhost는 호스트 Ollama가 아니므로 임베딩 주소를 LLM과 같이 host.docker.internal로 준다.
  # 켜려면 .env(또는 셸)에 RAG_ENABLED=true RAG_EMBEDDING_MODEL RAG_EMBEDDING_DIMENSION을 둔다. 문서 색인은 호스트에서 scripts/rag-index.
  RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL_CONTAINER:-http://host.docker.internal:11434/v1}
  RAG_ENABLED: ${RAG_ENABLED:-false}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
  RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-0}
  RAG_RETRIEVAL_MIN_SCORE: ${RAG_RETRIEVAL_MIN_SCORE:-0.54}
  # 6단계 M45: 지표 관리 서버는 .env에 MANAGEMENT_METRICS_TOKEN이 있을 때만 켜진다(없으면 리스너 0). 컨테이너 안에서는 모든 인터페이스에
  # 바인딩하되(같은 네트워크의 Prometheus가 닿아야 하므로) 9091은 호스트에 게시하지 않고 `scrape` 네트워크로만 노출한다.
  MANAGEMENT_SERVER_ADDRESS: 0.0.0.0

services:
  rabbitmq:
    image: rabbitmq:3.13-alpine
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    mem_limit: 512m

  postgres:
    # pgvector 확장이 들어 있는 이미지(3단계 RAG, V3 마이그레이션이 extension을 만든다). RAG를 꺼도 같은 이미지를 쓴다.
    # 주의: 옛 postgres:16-alpine 볼륨(musl)과 collation이 달라 기존 postgres-data 볼륨은 백업(pg_dump) 후 초기화해야 한다.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: slacklab
      POSTGRES_USER: slacklab
      # 기본값을 두지 않는다. .env에 POSTGRES_PASSWORD를 넣는다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정한다}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slacklab -d slacklab"]
      interval: 3s
      timeout: 3s
      retries: 15
    mem_limit: 384m

  receiver:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: receiver
    # alerts: Grafana가 웹훅을 보내는 경로(수신만). scrape: Prometheus가 지표를 긁는 경로. default: rabbitmq·postgres 도달.
    networks: [default, scrape, alerts]
    ports:
      - "127.0.0.1:${RECEIVER_PORT:-8080}:8080"

  worker:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: worker
    networks: [default, scrape]

  reactor:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: reactor
    networks: [default, scrape]

# 6단계 M45: 선택형 모니터링 스택(compose.monitoring.yaml, M46)이 붙는 네트워크. 모니터링을 안 써도 정의만 있고 비용은 없다.
# internal이 아니다 — Prometheus(호스트 모드의 host.docker.internal:9091)와 Grafana(호스트 웹훅·n8n)가 호스트에 닿아야 한다.
networks:
  scrape: {}
  alerts: {}

volumes:
  rabbitmq-data:
  postgres-data:
