{
  "global": {
    "scrape_interval": "10s",
    "scrape_timeout": "5s",
    "evaluation_interval": "1m"
  },
  "scrape_configs": [
    {
      "job_name": "slack-lab",
      "metrics_path": "/actuator/prometheus",
      "scheme": "http",
      "follow_redirects": false,
      "authorization": {
        "type": "Bearer",
        "credentials_file": "/run/secrets/metrics_token"
      },
      "scrape_interval": "10s",
      "scrape_timeout": "5s",
      "file_sd_configs": [
        {
          "files": [
            "/etc/prometheus/targets/*.json"
          ],
          "refresh_interval": "10s"
        }
      ]
    }
  ]
}
