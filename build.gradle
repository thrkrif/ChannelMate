plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.slack'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Boot 3.4.1 기본 Testcontainers 1.20.4는 Docker Engine 29(API 1.54)와 호환되지 않아 400으로 실패한다.
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // M20: 작업 상태 저장소(Postgres). 연결 풀·마이그레이션은 어댑터가 직접 구성한다(전역 자동 구성은 끈다)
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // M21: 큐(RabbitMQ). 확인(confirm)·ack·채널을 직접 다루려고 클라이언트 라이브러리를 그대로 쓴다
    implementation 'com.rabbitmq:amqp-client'
    // 6단계 M45: 선택형 모니터링 스택이 긁어 가는 지표. 관리 서버는 토큰이 있을 때만 켜진다(config/RoleWebTypePostProcessor)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // 한쪽만 선언하면 컴파일이 실패한다 (ARCHITECTURE §7)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 코어가 어댑터·인프라 라이브러리를 모른다는 의존 방향을 빌드에서 강제한다(ADR-9, M19)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:rabbitmq'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 시험 JVM이 호스트의 모니터링·LLM 설정을 상속하지 않게 접두 단위로 지운다(새 LLM_*·MANAGEMENT_* 키도 자동 포함).
// 이 목록은 상수 한 곳이며 scripts/test_log_contract.py가 계획의 4개와 같은지 확인한다. 로그는 저장소 .runtime 대신 build 아래로 보낸다.
def testEnvStripPrefixes = ['MANAGEMENT_', 'LLM_', 'GRAFANA_', 'SLACK_LAB_']

tasks.named('test') {
    useJUnitPlatform()
    environment.keySet().removeIf { k -> testEnvStripPrefixes.any { k.startsWith(it) } }
    environment 'SLACK_LAB_LOG_DIR', layout.buildDirectory.dir('test-logs').get().asFile.path
}
